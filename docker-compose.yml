name: inversiones-lr-frontend

services:
  # Build optimizado servido por nginx.
  #   docker compose up -d --build        -> http://localhost:4200
  frontend:
    build:
      context: .
      target: runtime
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-development}
    image: inversiones-lr-frontend:${BUILD_CONFIGURATION:-development}
    ports:
      - '${FRONTEND_PORT:-4200}:80'
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  # Desarrollo con recarga en caliente, sin instalar Node en la máquina.
  #   docker compose --profile dev up frontend-dev  -> http://localhost:4200
  frontend-dev:
    profiles: ['dev']
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx ng serve --host 0.0.0.0 --poll 1000"
    ports:
      - '4200:4200'
    environment:
      NG_CLI_ANALYTICS: 'false'
      API_PROXY_TARGET: ${BACKEND_URL:-http://host.docker.internal:8080}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Pruebas unitarias en Chrome headless.
  #   docker compose --profile test run --rm frontend-test
  frontend-test:
    profiles: ['test']
    build:
      context: .
      target: test
    image: inversiones-lr-frontend:test

volumes:
  node_modules:
