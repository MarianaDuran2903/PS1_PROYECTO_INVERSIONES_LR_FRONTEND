# Configuración del análisis de SonarQube Cloud para el frontend.
# Las rutas son relativas a la raíz del repositorio.

# TODO: reemplazar por los valores reales de SonarQube Cloud
# (Project information > Organization key / Project key).
sonar.organization=TU_ORGANIZACION
sonar.projectKey=TU_ORGANIZACION_mar-frontend

# Código fuente y pruebas
sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/node_modules/**
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Cobertura generada por "ng test --code-coverage" (reporter lcovonly en karma.conf.js)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,src/main.ts

# Hace fallar el análisis (y el job) si el Quality Gate no pasa
sonar.qualitygate.wait=true
