<form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
  <fieldset class="form" [disabled]="enviando()">
    <legend class="visually-hidden">Nueva contraseña</legend>

    @if (pedirToken()) {
      <div class="field">
        <label for="token">Código de recuperación <span aria-hidden="true">*</span></label>
        <input
          id="token"
          type="text"
          formControlName="token"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          [attr.aria-invalid]="errorDe('token') !== null"
          [attr.aria-describedby]="errorDe('token') ? 'token-error' : null"
          required
        />
        @if (errorDe('token'); as error) {
          <p class="field__error" id="token-error" aria-live="polite">{{ error }}</p>
        }
      </div>
    }

    <div class="field">
      <label for="contrasena">Nueva contraseña <span aria-hidden="true">*</span></label>
      <div class="field__password">
        <input
          id="contrasena"
          [type]="mostrarContrasena() ? 'text' : 'password'"
          formControlName="contrasena"
          autocomplete="new-password"
          [attr.maxlength]="contrasenaMaxLength"
          [attr.aria-invalid]="errorDe('contrasena') !== null"
          [attr.aria-describedby]="
            errorDe('contrasena')
              ? 'contrasena-requisitos contrasena-error'
              : 'contrasena-requisitos'
          "
          required
        />
        <button
          type="button"
          class="field__toggle"
          (click)="alternarContrasena()"
          [attr.aria-pressed]="mostrarContrasena()"
        >
          {{ mostrarContrasena() ? 'Ocultar' : 'Mostrar' }}
          <span class="visually-hidden">contraseña</span>
        </button>
      </div>
      <div id="contrasena-requisitos">
        <app-requisitos-contrasena [valor]="contrasenaEscrita()" />
      </div>
      @if (errorDe('contrasena'); as error) {
        <p class="field__error" id="contrasena-error" aria-live="polite">{{ error }}</p>
      }
    </div>

    <div class="field">
      <label for="confirmarContrasena"
        >Confirmar contraseña <span aria-hidden="true">*</span></label
      >
      <input
        id="confirmarContrasena"
        [type]="mostrarContrasena() ? 'text' : 'password'"
        formControlName="confirmarContrasena"
        autocomplete="new-password"
        [attr.maxlength]="contrasenaMaxLength"
        [attr.aria-invalid]="errorDe('confirmarContrasena') !== null"
        [attr.aria-describedby]="
          errorDe('confirmarContrasena') ? 'confirmarContrasena-error' : null
        "
        required
      />
      @if (errorDe('confirmarContrasena'); as error) {
        <p class="field__error" id="confirmarContrasena-error" aria-live="polite">{{ error }}</p>
      }
    </div>

    <button type="submit" class="btn btn--primary btn--block" [attr.aria-busy]="enviando()">
      {{ enviando() ? 'Cambiando contraseña…' : 'Cambiar contraseña' }}
    </button>
  </fieldset>
</form>
