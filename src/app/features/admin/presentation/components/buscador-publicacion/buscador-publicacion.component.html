<section class="buscador card" aria-labelledby="buscador-titulo">
  <h2 id="buscador-titulo">Intervenir una publicación</h2>
  <p class="buscador__ayuda">
    Escribe el número de la publicación para corregirla. Tendrás que indicar un motivo, que queda
    registrado.
  </p>

  <form class="buscador__form" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <div class="field">
      <label for="numeroPublicacion">Número de publicación</label>
      <input
        id="numeroPublicacion"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        formControlName="numero"
        [attr.aria-invalid]="error() !== null"
        [attr.aria-describedby]="error() ? 'numeroPublicacion-error' : null"
        required
      />
      @if (error(); as mensaje) {
        <p class="field__error" id="numeroPublicacion-error">{{ mensaje }}</p>
      }
    </div>
    <button type="submit" class="btn btn--primary">Intervenir</button>
  </form>
</section>
