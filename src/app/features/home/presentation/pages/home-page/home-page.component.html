<section class="hero" aria-labelledby="hero-titulo">
  <div class="hero__contenido">
    <p class="hero__etiqueta">Alojamientos con identidad</p>
    <h1 class="hero__titulo" id="hero-titulo">Un lugar para bajar el ritmo</h1>
    <p class="hero__texto">
      Encuentra estancias únicas en los destinos más especiales de Colombia.
    </p>
    <div class="hero__acciones">
      <a class="btn btn--primary btn--lg" routerLink="/marketplace">Buscar alojamiento</a>
      <a
        class="btn btn--outline btn--lg"
        routerLink="/auth/registro"
        [queryParams]="paramsAnfitrion"
        >Publicar alojamiento</a
      >
    </div>
  </div>
</section>
